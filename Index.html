<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MaFlaC</title>
<meta name="theme-color" content="#0c3d39">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MaFlaC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html,body{margin:0;height:100%;background:#0c3d39;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#top,#bot{position:fixed;left:0;right:0;z-index:3;pointer-events:none}
#top{top:0;height:env(safe-area-inset-top,0px);background:#0c3d39}
#bot{bottom:0;height:env(safe-area-inset-bottom,0px);background:#f2f6f4}
iframe{position:fixed;left:0;width:100%;top:env(safe-area-inset-top,0px);height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:#f2f6f4}
#splash{position:fixed;inset:0;z-index:2;background:linear-gradient(160deg,#14544e,#0c3d39 60%,#092e2b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s}
#splash img{width:96px;height:96px;border-radius:22px}
#splash b{font:600 28px Georgia,serif;margin-top:14px}
#splash span{color:#b6d2cd;font-size:14px;margin-top:4px}
#off{display:none;position:fixed;inset:0;z-index:4;background:#0c3d39;color:#fff;text-align:center;padding:30px;flex-direction:column;align-items:center;justify-content:center}
#off button,#ib button.go{background:#c29a3e;color:#2b2108;border:0;border-radius:12px;padding:12px 20px;font:600 16px inherit;margin-top:16px}
#ib{display:none;position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:5;background:#fff;color:#0e2a28;border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(12,61,57,.35);font-size:14.5px;line-height:1.4}
#ib button.x{position:absolute;top:6px;right:10px;background:none;border:0;font-size:22px;color:#5f7774}
#ib button.go{margin-top:8px;padding:9px 16px;font-size:15px}
</style></head><body>
<div id="top"></div><div id="bot"></div>
<div id="splash"><img src="icons/icon-192.png" alt=""><b>MaFlaC</b><span>Government Law College Kozhikode</span></div>
<div id="off"><b style="font:600 22px Georgia,serif">You are offline</b><p style="color:#b6d2cd">MaFlaC needs an internet connection to load your attendance.</p><button onclick="location.reload()">Try again</button></div>
<div id="ib"><button class="x" aria-label="Close" onclick="hideIb()">&times;</button><div id="ibt"></div><button class="go" id="ibg" style="display:none">Install app</button></div>
<iframe id="app" title="MaFlaC" allow="clipboard-write"></iframe>
<script>
// >>> Paste your Apps Script web app URL (ends in /exec) between the quotes <<<
const APP_URL='https://script.google.com/macros/s/AKfycbwQB22pffqpJ_ryHJG0orujeDSMHithnc6jP4cui6e9SipyZkPJUGFsf6qt3VhgusgRNQ/exec';

const f=document.getElementById('app'),sp=document.getElementById('splash'),off=document.getElementById('off');
function boot(){
  if(!navigator.onLine){off.style.display='flex';sp.style.display='none';return;}
  off.style.display='none';f.src=APP_URL;
}
f.addEventListener('load',()=>setTimeout(()=>{sp.style.opacity=0;setTimeout(()=>sp.style.display='none',400)},500));
addEventListener('online',()=>{if(!f.src)boot();else if(off.style.display==='flex')location.reload()});
boot();

// Session bridge: the app asks this page to keep the login, because iOS Safari
// blocks storage inside embedded frames.
addEventListener('message',e=>{
  if(!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname))return;
  const m=e.data;if(!m||!m.mf)return;
  try{
    if(m.mf==='get')e.source.postMessage({mf:'val',v:localStorage.getItem('mf')},e.origin);
    else if(m.mf==='set')localStorage.setItem('mf',m.v);
    else if(m.mf==='clear')localStorage.removeItem('mf');
  }catch(x){if(m.mf==='get')e.source.postMessage({mf:'val',v:null},e.origin);}
});

// Install hints
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ib=document.getElementById('ib'),ibt=document.getElementById('ibt'),ibg=document.getElementById('ibg');
function hideIb(){ib.style.display='none';try{localStorage.setItem('mf_ib','1')}catch(e){}}
let dp=null,seen=false;try{seen=localStorage.getItem('mf_ib')}catch(e){}
if(!standalone&&!seen){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){setTimeout(()=>{ibt.innerHTML='Install MaFlaC: tap the <b>Share</b> button in Safari, then <b>Add to Home Screen</b>.';ib.style.display='block'},4000);}
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;ibt.textContent='Install MaFlaC on your phone for quick access.';ibg.style.display='inline-block';ib.style.display='block'});
  ibg.onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;hideIb()};
}
addEventListener('appinstalled',()=>{ib.style.display='none'});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
